name: CI

on:
    pull_request:
        branches:
            - dev
            - stg
            - master

jobs:
    ci:
        name: CI Checks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Format check
              run: pnpm prettier --check "**/*.{ts,tsx,js,jsx,mjs,cjs,css,json,md}"
